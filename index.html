<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050b12">
    <meta name="description" content="wx1ngf19 的星辰大海。">
    <meta property="og:title" content="Reverie">
    <meta property="og:description" content="一片星海，一个属于我的坐标。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wx1ngf19.github.io/">
    <title>Reverie</title>
    <link rel="icon" href="./favicon.svg?v=woodland-1" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=woodland-1">
    <link rel="modulepreload" href="./assets/audio/library.js?v=woodland-1">
    <script type="module" src="./app.js?v=woodland-2"></script>
  </head>
  <body>
    <main class="universe-stage" id="home" aria-label="wx1ngf19 的星辰大海">
      <h1 class="sr-only" aria-label="Reverie · wx1ngf19"></h1>
      <div class="universe" aria-hidden="true">
        <div class="scene-fallback"></div>
        <canvas id="universe-canvas"></canvas>
        <canvas id="stars-canvas"></canvas>
        <div class="scene-vignette"></div>
        <div class="scene-grain"></div>
      </div>
      <canvas id="pointer-canvas" aria-hidden="true"></canvas>
      <div class="pointer-aura" aria-hidden="true"></div>
      <audio id="ambient-audio" preload="none"></audio>
      <button class="signature" id="music-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false" aria-keyshortcuts="Space" title="Play music" data-audio="paused">
        <span class="music-rings" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="music-click-wave" aria-hidden="true"></span>
        <img class="signature-symbol" src="./assets/emblem.svg" width="120" height="120" alt="" draggable="false">
      </button>
    </main>
  </body>
</html>

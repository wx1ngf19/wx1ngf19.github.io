<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071218">
    <meta name="description" content="A little atlas of everyone who found their way here.">
    <title>Atlas · Reverie</title>
    <link rel="icon" href="../assets/icons/favicon.svg?v=reverie-8" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/styles/atlas.css?v=atlas-3">
    <script type="module" src="../src/atlas/app.js?v=atlas-3"></script>
  </head>
  <body>
    <div class="atlas-aura" aria-hidden="true"></div>
    <header class="atlas-header">
      <a class="home-link" href="../" aria-label="Back to Reverie"><img src="../assets/icons/emblem.svg" width="36" height="36" alt=""><span>REVERIE<span class="brand-divider">/</span>ATLAS</span></a>
      <div class="periods" role="group" aria-label="Date range">
        <button type="button" data-days="7" aria-pressed="false" aria-label="Last 7 days">7d</button>
        <button type="button" data-days="30" aria-pressed="true" aria-label="Last 30 days">30d</button>
        <button type="button" data-days="90" aria-pressed="false" aria-label="Last 90 days">90d</button>
      </div>
    </header>
    <main class="atlas-layout">
      <section class="world-stage" aria-labelledby="atlas-title">
        <h1 id="atlas-title" class="sr-only">A visitor atlas</h1>
        <canvas id="atlas-canvas" tabindex="0" role="img" aria-label="Visitor atlas. Drag or use arrow keys to rotate. Scroll or use plus and minus to zoom. Select a place from the list for regional counts."></canvas>
        <div class="map-tooltip" id="map-tooltip" hidden></div>
        <div class="map-toolbar"><button type="button" id="reset-globe" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 9a8 8 0 1 1-1 6M5 4v5h5"/></svg></button><span>Drag to orbit</span></div>
      </section>
      <aside class="atlas-ledger" aria-label="Visit counts">
        <div class="summary"><div><strong id="total-views">—</strong><span>visits</span></div><div><strong id="total-countries">—</strong><span>places</span></div></div>
        <div class="connection-row"><div class="connection-state" id="atlas-status" role="status" aria-live="polite">Connecting</div><button type="button" id="refresh-atlas" aria-label="Refresh counts" title="Refresh counts"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M19 9a7.5 7.5 0 1 0 0 7M19 4v5h-5"/></svg></button></div>
        <button class="retry" id="retry-atlas" type="button" hidden>Retry</button>
        <section class="origins" aria-label="Visit origins">
          <div class="section-label" id="origins-heading"><h2>Origins</h2><span id="range-label">30d</span></div>
          <ol class="country-list" id="country-list" aria-label="Visits by country or territory" tabindex="0"></ol>
          <div class="region-detail" id="region-detail" hidden><div class="section-label"><h2 id="region-heading"></h2><button type="button" id="clear-country" aria-label="All origins" title="All origins">×</button></div><ol id="region-list" aria-label="Regional visits" tabindex="0"></ol></div>
        </section>
        <div class="timeline-wrap"><svg id="visit-timeline" viewBox="0 0 300 62" role="img" aria-label="Daily visits"></svg><div class="timeline-dates"><span id="first-date">—</span><span id="last-date">—</span></div></div>
      </aside>
    </main>
    <footer class="atlas-footer"><details class="atlas-note"><summary aria-label="About this atlas" title="About this atlas">i</summary><div><p>Visits, not unique visitors. Approximate network regions. No raw IPs stored.</p><p>Dates: UTC+8. Counts may lag 60s.</p><p>Map: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a> · <a href="https://d3js.org/" target="_blank" rel="noopener noreferrer">D3</a></p></div></details></footer>
  </body>
</html>

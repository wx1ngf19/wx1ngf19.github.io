<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Music · Reverie</title>
    <link rel="icon" href="../assets/icons/favicon.svg?v=reverie-7" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/styles/music.css?v=reverie-7">
    <script type="module" src="../src/audio/listening.js?v=reverie-7"></script>
  </head>
  <body>
    <main>
      <header>
        <a class="return" href="../">← Reverie</a>
        <h1>A little room for music.</h1>
        <p>原版与纯音乐，来自创作者及发行方。带 ↗ 的曲目前往官方页面播放。</p>
      </header>
      <section aria-labelledby="selected-title">
        <h2 id="selected-title">精选曲目</h2>
        <div class="recording" id="recording" hidden>
          <div class="recording-heading"><div><h3 id="recording-title"></h3><p id="recording-artist"></p></div><button id="close-player" type="button" aria-label="关闭播放器">×</button></div>
          <div id="official-player"></div>
          <a id="official-source" target="_blank" rel="noopener noreferrer">在官方页面播放 ↗</a>
        </div>
        <div class="track-list" id="selected-tracks"></div>
      </section>
      <details class="background" id="background">
        <summary>主页背景音乐与署名</summary>
        <a href="#selected-title">精选曲目 ↑</a>
        <p>白天、夜晚各十首纯音乐。完整录音保留各自授权及创作者署名。</p>
        <div id="background-tracks"></div>
        <a href="../assets/audio/CREDITS.txt">Plain text credits</a>
      </details>
    </main>
  </body>
</html>
